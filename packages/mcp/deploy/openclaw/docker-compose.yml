services:
  suzaku-bot:
    image: ${SUZAKU_BOT_IMAGE:-suzaku-monitor:local}
    build:
      context: ../../../..
      dockerfile: packages/mcp/deploy/openclaw/Dockerfile
      target: bot
    restart: unless-stopped
    # MCP and concurrent CLI subprocesses are Node processes (~12 threads each;
    # threads count against pids_limit). 100 previously starved heavy turns.
    pids_limit: 256
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    # A heavy Kimi multi-tool turn can overlap the MCP/CLI subprocesses. Two cores
    # keep the gateway responsive while the model waits on chain reads.
    cpus: 2.0
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=128m
    volumes:
      - audit-data:/data/audit
      # Persists sessions, cron declarations, Telegram spool, usage accounting,
      # and the isolated heartbeat agent's digest checkpoint across recreates.
      - openclaw-state:/home/node/.openclaw
      # Default is Kimi. Set SUZAKU_MONITOR_CONFIG=./openclaw-codex.json only for
      # the explicitly documented optional Codex profile.
      - ${SUZAKU_MONITOR_CONFIG:-./openclaw.json}:/home/node/.openclaw/openclaw.json.tpl:ro
      - ./SOUL.md:/home/node/.openclaw/workspace/SOUL.md:ro
      - ./EPOCHS.md:/home/node/.openclaw/workspace/EPOCHS.md:ro
    environment:
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - SUZAKU_ENABLE_ANTHROPIC_FALLBACK=${SUZAKU_ENABLE_ANTHROPIC_FALLBACK:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_USER_ID=${TELEGRAM_ADMIN_USER_ID}
      - TELEGRAM_GROUP_ID=${TELEGRAM_GROUP_ID}
      - TELEGRAM_TOPIC_ID=${TELEGRAM_TOPIC_ID:-}
      # OpenClaw (≥2026.x) refuses to start its gateway in a container without auth
      # ("Refusing to bind gateway to auto without auth") — any random secret works,
      # e.g. `openssl rand -hex 24`. The gateway port is not published; the token only
      # gates access within the compose network.
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      # Optional paid Etherscan V2 key for Avalanche event scans. The legacy
      # SNOWSCAN name remains accepted during migration but should stay empty.
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
      - SNOWSCAN_API_KEY=${SNOWSCAN_API_KEY:-}
    networks:
      - suzaku-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # DM-only propose bot: same image, --propose-only MCP profile. Holds a Safe
  # DELEGATE key (never an owner key) — it can queue proposals for human review in
  # the Safe UI, never execute. The public group bot above stays keyless.
  # Optional: bring it up explicitly with `docker compose --profile propose up -d`.
  suzaku-propose-bot:
    profiles: ["propose"]
    build:
      context: ../../../..
      dockerfile: packages/mcp/deploy/openclaw/Dockerfile
      target: bot
    restart: unless-stopped
    # 256: the Codex app-server + MCP server + concurrent CLI subprocesses are all node
    # processes (~12 threads each, threads count against pids_limit); 100 starved them
    # mid-turn ("Transport closed").
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.0
    tmpfs:
      - /tmp:size=128m
    volumes:
      - audit-data-propose:/data/audit
      - ./openclaw-propose.json:/home/node/.openclaw/openclaw.json.tpl:ro
      - ./SOUL-propose.md:/home/node/.openclaw/workspace/SOUL.md:ro
      - ./EPOCHS.md:/home/node/.openclaw/workspace/EPOCHS.md:ro
      - ./mcporter-propose.json:/home/node/.openclaw/workspace/config/mcporter.json.tpl:ro
    # The delegate key and Safe API key are delivered as file secrets (mounted at
    # /run/secrets/<name>, read at spawn time) — NOT env vars. They never appear in
    # `docker inspect`, /proc/PID/environ, or the rendered mcporter.json.
    secrets:
      - delegate_pk
      - safe_api_key
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_PROPOSE_BOT_TOKEN:-}
      # Numeric Telegram user IDs ONLY (tg:123456), never @usernames — usernames can
      # be released and re-registered by someone else.
      - TELEGRAM_ADMIN_USER_ID=${TELEGRAM_ADMIN_USER_ID}
      - SUZAKU_PK_FILE=/run/secrets/delegate_pk
      - SAFE_API_KEY_FILE=/run/secrets/safe_api_key
      - SUZAKU_SAFE_ADDRESS=${SUZAKU_SAFE_ADDRESS:-}
      - SUZAKU_REWARDS_ADDRESS=${SUZAKU_REWARDS_ADDRESS:-}
      - SUZAKU_MIDDLEWARE_ADDRESS=${SUZAKU_MIDDLEWARE_ADDRESS:-}
      - SUZAKU_MAX_REWARDS_AMOUNT=${SUZAKU_MAX_REWARDS_AMOUNT:-}
      # Same gateway-auth requirement as suzaku-bot above.
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - SNOWSCAN_API_KEY=${SNOWSCAN_API_KEY:-}
    networks:
      - suzaku-net

  # Group cache bot: same image, --public-write MCP profile. Holds a fresh,
  # role-less low-balance EOA that can execute exactly middleware_cache_stakes.
  # Optional: bring it up explicitly with `docker compose --profile cache up -d`.
  # Keep SUZAKU_CACHE_DENY_TOOLS=middleware_cache_stakes until the unfunded dark
  # launch and funding checks have passed; set it to an empty string to enable.
  suzaku-cache-bot:
    profiles: ["cache"]
    build:
      context: ../../../..
      dockerfile: packages/mcp/deploy/openclaw/Dockerfile
      target: bot
    restart: unless-stopped
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.0
    tmpfs:
      - /tmp:size=128m
    volumes:
      - audit-data-cache:/data/audit
      - ./openclaw-cache.json:/home/node/.openclaw/openclaw.json.tpl:ro
      - ./SOUL-cache.md:/home/node/.openclaw/workspace/SOUL.md:ro
      - ./EPOCHS.md:/home/node/.openclaw/workspace/EPOCHS.md:ro
      - ./mcporter-cache.json:/home/node/.openclaw/workspace/config/mcporter.json.tpl:ro
    secrets:
      - cache_pk
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_CACHE_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_USER_ID=${TELEGRAM_ADMIN_USER_ID}
      - TELEGRAM_GROUP_ID=${TELEGRAM_GROUP_ID}
      - SUZAKU_PK_FILE=/run/secrets/cache_pk
      - SUZAKU_MIDDLEWARE_ADDRESS=${SUZAKU_MIDDLEWARE_ADDRESS:-}
      - SUZAKU_MIDDLEWARE_NETWORK=${SUZAKU_MIDDLEWARE_NETWORK:-mainnet}
      - SUZAKU_CACHE_KEY_ADDRESS=${SUZAKU_CACHE_KEY_ADDRESS:-}
      - SUZAKU_CACHE_KEY_MIN_AVAX=${SUZAKU_CACHE_KEY_MIN_AVAX:-0.05}
      # Off-switch, deny-ON by default. Single-dash '-' (NOT ':-'): the default applies
      # only when SUZAKU_CACHE_DENY_TOOLS is UNSET. To ENABLE writes, set it to an empty
      # value in .env (SUZAKU_CACHE_DENY_TOOLS=); deleting/omitting the line re-blocks.
      - SUZAKU_CACHE_DENY_TOOLS=${SUZAKU_CACHE_DENY_TOOLS-middleware_cache_stakes}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - SNOWSCAN_API_KEY=${SNOWSCAN_API_KEY:-}
    networks:
      - suzaku-net

# File secrets: host files holding the delegate EOA key, Safe tx-service API key,
# and cache EOA key.
# Create them out-of-band (chmod 600, never committed), e.g.:
#   echo -n 0x<delegate-key> > ./secrets/delegate_pk && chmod 600 ./secrets/delegate_pk
#   echo -n <safe-api-key>   > ./secrets/safe_api_key && chmod 600 ./secrets/safe_api_key
#   echo -n 0x<cache-key>    > ./secrets/cache_pk && chmod 600 ./secrets/cache_pk
# Override the HOST paths with SUZAKU_DELEGATE_PK_FILE / SUZAKU_SAFE_API_KEY_FILE in your
# .env. (Deliberately NOT named SAFE_API_KEY_FILE — that name is the container-internal
# path the service env sets above; reusing it here would point Docker at /run/secrets/...
# on the host.)
secrets:
  delegate_pk:
    file: ${SUZAKU_DELEGATE_PK_FILE:-./secrets/delegate_pk}
  safe_api_key:
    file: ${SUZAKU_SAFE_API_KEY_FILE:-./secrets/safe_api_key}
  cache_pk:
    file: ${SUZAKU_CACHE_PK_FILE:-./secrets/cache_pk}

volumes:
  audit-data:
    name: suzaku-monitor-audit
  audit-data-propose:
  audit-data-cache:
  openclaw-state:
    name: suzaku-monitor-kimi-state-v1

networks:
  suzaku-net:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.name: br-suzaku
